version: '3.8'

services:
  backend:
    build:
      context: .
      dockerfile: Dockerfile.backend
    container_name: peer_jewelry_backend
    ports:
      - "5001:5000"
    environment:
      - REDIS_URL=${REDIS_URL}
    volumes:
      - product_images:/app/public/products
    restart: unless-stopped

  frontend:
    build:
      context: .
      dockerfile: Dockerfile.frontend
    container_name: peer_jewelry_frontend
    ports:
      - "8080:8080"
    depends_on:
      - backend
    volumes:
      - product_images:/usr/share/nginx/html/products
    restart: unless-stopped

volumes:
  product_images:
