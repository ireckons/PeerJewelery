  <text x="400" y="365" text-anchor="middle" fill="#f5f5f5" font-family="Georgia, serif" font-size="28" font-weight="400" letter-spacing="2">Riviera Tennis</text>
  <text x="400" y="415" text-anchor="middle" fill="#f5f5f5" font-family="Georgia, serif" font-size="28" font-weight="400" letter-spacing="2">Bracelet Set</text>
